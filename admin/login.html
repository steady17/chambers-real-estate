<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Chambers Real Estate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../img/logo-symbol-dark.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../img/icon-apple-touch.png">
<meta name="theme-color" content="#5C2A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chambers Admin">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/site.css">
<link rel="stylesheet" href="admin.css">
</head>
<body style="background:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;">

<div style="background:var(--white); border-radius:var(--radius-l); box-shadow:var(--shadow-2); padding:40px; width:100%; max-width:380px;">
  <div style="text-align:center; margin-bottom:24px;">
    <img src="../img/logo-full-ink.png" alt="Chambers Real Estate" style="height:110px; margin-bottom:12px;">
    <p class="muted" style="font-size:.88rem">Admin dashboard login</p>
  </div>

  <form id="login-form" onsubmit="handleLogin(event)">
    <div style="margin-bottom:16px;">
      <label for="login-email" style="display:block; font-size:.82rem; font-weight:600; color:var(--ink); margin-bottom:7px;">Email</label>
      <input id="login-email" type="email" required autocomplete="username" style="width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:6px; font-size:.95rem;">
    </div>
    <div style="margin-bottom:20px;">
      <label for="login-password" style="display:block; font-size:.82rem; font-weight:600; color:var(--ink); margin-bottom:7px;">Password</label>
      <input id="login-password" type="password" required autocomplete="current-password" style="width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:6px; font-size:.95rem;">
    </div>
    <div id="login-error" style="display:none; color:#B3261E; font-size:.85rem; margin-bottom:16px;"></div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
    <div style="text-align:center; margin-top:16px;">
      <a href="#" onclick="handleForgotPassword(event)" style="font-size:.85rem; color:var(--charcoal-60);">Forgot password?</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
async function handleForgotPassword(e){
  e.preventDefault();
  const email = document.getElementById("login-email").value;
  if(!email){
    alert("Type your email address into the box above first, then tap \"Forgot password?\" again.");
    return;
  }
  const { error } = await chambersDB.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + "/admin/reset-password.html"
  });
  if(error){
    alert("Couldn't send reset email — " + error.message);
    return;
  }
  alert("Check your email for a link to reset your password.");
}

async function handleLogin(e){
  e.preventDefault();
  const btn = e.target.querySelector("button[type=submit]");
  const errEl = document.getElementById("login-error");
  errEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Logging in…";

  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;

  const { error } = await chambersDB.auth.signInWithPassword({ email, password });

  if(error){
    errEl.textContent = "Incorrect email or password.";
    errEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Log in";
    return;
  }

  location.href = "index.html";
}

// If already logged in, skip straight to the dashboard
(async () => {
  const { data } = await chambersDB.auth.getSession();
  if(data?.session) location.href = "index.html";
})();
</script>
</body>
</html>
